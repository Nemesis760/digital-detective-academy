<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Magnifying glass lens (circle outline) -->
  <circle cx="43" cy="41" r="19" fill="none" stroke="#a78bfa" stroke-width="9"/>
  <!-- Handle -->
  <line x1="57" y1="56" x2="73" y2="73" stroke="#a78bfa" stroke-width="9" stroke-linecap="round"/>
  <!-- Inner shine -->
  <circle cx="38" cy="35" r="6" fill="white" opacity="0.15"/>
</svg>
