<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative grid dots -->
  <g opacity="0.08" fill="#a78bfa">
    <circle cx="50" cy="50" r="3"/><circle cx="150" cy="50" r="3"/><circle cx="250" cy="50" r="3"/>
    <circle cx="50" cy="150" r="3"/><circle cx="150" cy="150" r="3"/><circle cx="250" cy="150" r="3"/>
    <circle cx="50" cy="250" r="3"/><circle cx="150" cy="250" r="3"/><circle cx="250" cy="250" r="3"/>
    <circle cx="50" cy="350" r="3"/><circle cx="150" cy="350" r="3"/><circle cx="250" cy="350" r="3"/>
    <circle cx="50" cy="450" r="3"/><circle cx="150" cy="450" r="3"/><circle cx="250" cy="450" r="3"/>
    <circle cx="50" cy="550" r="3"/><circle cx="150" cy="550" r="3"/><circle cx="250" cy="550" r="3"/>
    <circle cx="950" cy="100" r="3"/><circle cx="1050" cy="100" r="3"/><circle cx="1150" cy="100" r="3"/>
    <circle cx="950" cy="200" r="3"/><circle cx="1050" cy="200" r="3"/><circle cx="1150" cy="200" r="3"/>
    <circle cx="950" cy="500" r="3"/><circle cx="1050" cy="500" r="3"/><circle cx="1150" cy="500" r="3"/>
    <circle cx="950" cy="580" r="3"/><circle cx="1050" cy="580" r="3"/><circle cx="1150" cy="580" r="3"/>
  </g>

  <!-- Large glowing background circle (right side) -->
  <circle cx="920" cy="315" r="230" fill="url(#circleGrad)" opacity="0.12" filter="url(#softglow)"/>
  <circle cx="920" cy="315" r="180" fill="url(#circleGrad)" opacity="0.1"/>

  <!-- Big magnifying glass (right side) -->
  <!-- Lens outer ring -->
  <circle cx="895" cy="280" r="130" fill="none" stroke="#7c3aed" stroke-width="18" opacity="0.9" filter="url(#glow)"/>
  <!-- Lens glass (semi-transparent fill) -->
  <circle cx="895" cy="280" r="112" fill="#4c1d95" opacity="0.4"/>
  <!-- Lens inner shine -->
  <circle cx="860" cy="245" r="35" fill="white" opacity="0.06"/>
  <!-- Handle -->
  <line x1="985" y1="372" x2="1060" y2="452" stroke="#7c3aed" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Lens inner ring (detail) -->
  <circle cx="895" cy="280" r="85" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.3"/>

  <!-- Shield badge icon inside lens -->
  <g transform="translate(895,280)" opacity="0.85">
    <path d="M0,-45 L35,-25 L35,15 Q35,45 0,55 Q-35,45 -35,15 L-35,-25 Z" fill="url(#badgeGrad)" stroke="#a78bfa" stroke-width="2"/>
    <text x="0" y="12" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">🔍</text>
  </g>

  <!-- Left side content -->
  <!-- Top tag -->
  <rect x="80" y="120" width="200" height="38" rx="19" fill="#7c3aed" opacity="0.9"/>
  <text x="180" y="144" text-anchor="middle" fill="white" font-size="17" font-weight="700" font-family="Arial, sans-serif" letter-spacing="1">TÜRKÇE · ENGLISH</text>

  <!-- Main title -->
  <text x="80" y="250" fill="white" font-size="62" font-weight="900" font-family="Arial Black, Arial, sans-serif" letter-spacing="-1">Dijital Dedektif</text>
  <text x="80" y="325" fill="white" font-size="62" font-weight="900" font-family="Arial Black, Arial, sans-serif" letter-spacing="-1">Akademisi</text>

  <!-- Divider line -->
  <rect x="80" y="350" width="420" height="4" rx="2" fill="url(#circleGrad)" opacity="0.8"/>

  <!-- EN subtitle -->
  <text x="80" y="393" fill="#a78bfa" font-size="30" font-weight="700" font-family="Arial, sans-serif">Digital Detective Academy</text>

  <!-- Tagline -->
  <text x="80" y="445" fill="rgba(255,255,255,0.7)" font-size="22" font-family="Arial, sans-serif">Teknolojinin gizemlerini çöz,</text>
  <text x="80" y="475" fill="rgba(255,255,255,0.7)" font-size="22" font-family="Arial, sans-serif">dijital dünyada güvenle dolaş!</text>

  <!-- Module badges -->
  <g transform="translate(80, 510)">
    <rect x="0" y="0" width="90" height="36" rx="18" fill="rgba(124,58,237,0.4)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="45" y="23" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700" font-family="Arial, sans-serif">6 Modül</text>
  </g>
  <g transform="translate(185, 510)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="rgba(124,58,237,0.4)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700" font-family="Arial, sans-serif">İnteraktif Oyunlar</text>
  </g>
  <g transform="translate(330, 510)">
    <rect x="0" y="0" width="100" height="36" rx="18" fill="rgba(124,58,237,0.4)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="50" y="23" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700" font-family="Arial, sans-serif">Ücretsiz</text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="615" width="1200" height="15" fill="url(#circleGrad)" opacity="0.8"/>

  <!-- URL watermark -->
  <text x="1185" y="608" text-anchor="end" fill="rgba(255,255,255,0.35)" font-size="16" font-family="Arial, sans-serif">digitaldetectiveacademy.com</text>
</svg>
